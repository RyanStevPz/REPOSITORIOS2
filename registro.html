<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="CSS/login.css">
    <link rel="shortcut icon" href="img/ca3d417b894c43168b27c1954339baa6.jpg" type="image/jpeg">
</head>
<body>

    <main>
        <section>
            <form action="">
                <fieldset>
                    <legend>Crear cuenta</legend>

                    <label for="nombre">Nombre completo</label>
                    <input id="nombre" name="nombre" type="text" placeholder="Juana Pérez" autocomplete="name" required>


                    <label>Género</label>
                    <div class="grupo-radios">
                        <label for="genero-femenino">Femenino</label>
                        <input id="genero-femenino" name="genero" type="radio" value="femenino">

                        <label for="genero-masculino">Masculino</label>
                        <input id="genero-masculino" name="genero" type="radio" value="masculino">
                        <label for="genero-otro">Otro</label>
                        <input id="genero-otro" name="genero" type="radio" value="otro">
                    </div>

                    <label for="foto">Foto de perfil</label>
                    <input id="foto" name="foto" type="file" accept="image/*">

                    <label for="correo">Correo electrónico</label>
                    <input id="correo" name="correo" type="email" placeholder="correo@ejemplo.com" autocomplete="email" required>

                    <label for="telefono">Teléfono</label>
                    <input id="telefono" name="telefono" type="tel" placeholder="+1 234 567 8900" autocomplete="tel">
                    
                    <label for="pais">País</label>
                    <select id="pais" name="pais">
                        <option value="">Selecciona tu país</option>
                        <option value="ar">Argentina</option>
                        <option value="co">Colombia</option>
                        <option value="mx">México</option>
                        <option value="es">España</option>
                        <option value="otro">Otro</option>
                    </select>


                    <label for="contrasena">Contraseña</label>
                    <input id="contrasena" name="contrasena" type="password" placeholder="*********" autocomplete="new-password" required>

                    <label for="terminos">Acepto los términos y condiciones</label>
                    <input id="terminos" name="terminos" type="checkbox" required>

                    <label for="noticias">Deseo recibir noticias por correo</label>
                    <input id="noticias" name="noticias" type="checkbox">

                    <input type="submit" value="Registrarme">
                    <input type="reset" value="Limpiar">
                    
                    <p class="enlace">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión 
                    aquí</a></p>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
