<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="CSS/login.css">
    <link rel="shortcut icon" href="img/ca3d417b894c43168b27c1954339baa6.jpg" type="image/jpeg">
</head>
<body>

    <main>
        <section>
            <form action="">
                <fieldset>
                    <legend>Inicio de sesión</legend>
                    <p>Ingresa tus credenciales para acceder a tu cuenta.</p>

                    <label for="correo">Correo electrónico</label>
                    <input id="correo" name="correo" type="email" placeholder="correo@ejemplo.com" autocomplete="email" required>

                    <label for="contrasena">Contraseña</label>
                    <input id="contrasena" name="contrasena" type="password" placeholder="*********" autocomplete="current-password" required>

                    <label for="recordarme">Recordarme</label>
                    <input id="recordarme" name="recordarme" type="checkbox">
    
                    <input type="submit" value="Iniciar sesión">
                    <input type="reset" value="Limpiar">

                    <p class="enlace">¿No tienes una cuenta? <a href="registro.html">Regístrate 
                    aquí</a></p>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
